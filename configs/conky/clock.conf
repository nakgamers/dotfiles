conky.config = {
    update_interval = 1,
    double_buffer = true,
    use_xft = true,
    own_window = true,
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    alignment = 'bottom_middle',
    gap_x = 0,
    gap_y = 65,
    minimum_width = 420,
    maximum_width = 420,
    font = 'JetBrains Mono:size=14',
    default_color = 'FF5555',
    color1 = 'FFFFFF',
}
conky.text = [[
${alignc}${font JetBrains Mono:size=84}${time %H:%M}${font}
${alignc}${color1}${font JetBrains Mono:size=22}${time %A}${font}
${alignc}${time %d %B %Y}
]]
